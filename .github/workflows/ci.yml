name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix (optional - for faster CI)
        uses: cachix/cachix-action@v15
        if: hashFiles('cachix.yaml') != ''
        with:
          name: otto
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run all tests in devshell
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 2
          command: nix develop . --command make test
