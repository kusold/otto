[workspace]
resolver = "2"
members = ["crates/otto", "crates/otto-core", "crates/otto-beads", "crates/otto-tmux", "crates/otto-agent-claude", "crates/otto-log"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mike Kusold"]
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
signal-hook = { version = "0.3", features = ["iterator"] }
serde_json = "1.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
