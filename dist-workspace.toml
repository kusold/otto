[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# release.yml has intentional manual customizations (e.g. the homebrew tap
# dispatch step) on top of cargo-dist's generated output; tell cargo-dist the
# divergence is deliberate so `dist plan` doesn't error on it.
allow-dirty = ["ci"]

[dist.homebrew]
# The owner/org of the homebrew tap
org = "kusold"
# The name of the homebrew tap repository
tap = "homebrew-otto"
